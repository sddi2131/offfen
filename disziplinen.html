<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Disziplinen — Schaffensmenschen</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600&family=Work+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#121212;
    --paper:#f3f1ec;
    --gold:#c8a24a;
    --beton:#b7b3ad;
    --ziegel:#b73228;
  }
  *{ box-sizing:border-box; margin:0; padding:0; }
  html,body{
    background:var(--paper);
    color:var(--ink);
    font-family:'Work Sans', sans-serif;
  }

  header.site-header{
    display:flex;
    align-items:center;
    gap:0.9rem;
    padding:1.3rem 1.6rem;
    border-bottom:1px solid rgba(18,18,18,0.1);
  }
  .frame{
    position:relative;
    width:20px; height:24px;
    flex-shrink:0;
  }
  .frame::before{
    content:"";
    position:absolute; inset:0;
    border:1.4px solid var(--ink);
    border-right:none;
  }
  header.site-header a.wordmark{
    font-family:'Space Grotesk', sans-serif;
    font-weight:400;
    font-size:0.85rem;
    letter-spacing:0.06em;
    color:var(--ink);
    text-decoration:none;
    opacity:0.8;
  }
  header.site-header nav{ margin-left:auto; display:flex; gap:1.6rem; }
  header.site-header nav a{
    font-size:0.85rem;
    color:rgba(18,18,18,0.5);
    text-decoration:none;
  }
  header.site-header nav a.current{ color:var(--ink); font-weight:600; }

  main{ max-width:1000px; margin:0 auto; padding:2.4rem 1.8rem 5rem; }

  h1{
    font-family:'Space Grotesk', sans-serif;
    font-weight:500;
    font-size:1.9rem;
    margin-bottom:0.4rem;
  }
  .subline{
    font-size:0.95rem;
    color:rgba(18,18,18,0.55);
    margin-bottom:2.4rem;
  }

  .discipline-grid{
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(220px, 1fr));
    gap:1.4rem;
  }

  .discipline-card{
    display:flex;
    flex-direction:column;
    justify-content:flex-end;
    aspect-ratio:4/3;
    padding:1.2rem;
    border-radius:3px;
    text-decoration:none;
    color:var(--paper);
    position:relative;
    overflow:hidden;
    transition:transform 0.15s ease, box-shadow 0.15s ease;
  }
  .discipline-card:hover{
    transform:translateY(-3px);
    box-shadow:0 10px 24px rgba(18,18,18,0.18);
  }
  .discipline-card::before{
    content:"";
    position:absolute; inset:0;
    background-image:
      radial-gradient(ellipse at 25% 20%, rgba(255,255,255,0.14), transparent 55%),
      radial-gradient(ellipse at 80% 85%, rgba(0,0,0,0.18), transparent 60%);
  }
  .discipline-card span{
    position:relative;
    font-family:'Space Grotesk', sans-serif;
    font-weight:500;
    font-size:1.15rem;
  }

  .c-arts{ background:linear-gradient(155deg, #b73228, #7c211a); }
  .c-design{ background:linear-gradient(155deg, #121212, #3a3a3a); }
  .c-entertainment{ background:linear-gradient(155deg, #c8a24a, #8a6c2f); }
  .c-architektur{ background:linear-gradient(155deg, #b7b3ad, #6d6a65); }
  .c-grafik{ background:linear-gradient(155deg, #4a5568, #2d3340); }
</style>
</head>
<body>

  <header class="site-header">
    <span class="frame"></span>
    <a class="wordmark" href="/">Raum schaffen</a>
    <nav>
      <a href="/menschen.html">Menschen</a>
      <a href="/disziplinen.html" class="current">Disziplinen</a>
    </nav>
  </header>

  <main>
    <h1>Disziplinen</h1>
    <p class="subline">Fünf Bereiche, ein Raum — stöbere in den Werken der Schaffensmenschen.</p>

    <div class="discipline-grid">
      <a class="discipline-card c-arts" href="#"><span>Arts</span></a>
      <a class="discipline-card c-design" href="galerie-design.html"><span>Design</span></a>
      <a class="discipline-card c-entertainment" href="#"><span>Entertainment</span></a>
      <a class="discipline-card c-architektur" href="galerie-architektur.html"><span>Architektur</span></a>
      <a class="discipline-card c-grafik" href="#"><span>Grafik</span></a>
    </div>
  </main>

</body>
</html>
