<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Was entsteht — Schaffensmenschen</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500&family=Work+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --wood-dark:#121212;
    --mustard:#c8a24a;
    --paint-cream:#f3f1ec;
    --beton:#b7b3ad;
    --ziegel:#b73228;
  }
  *{ box-sizing:border-box; margin:0; padding:0; }
  html,body{
    background:var(--wood-dark);
    color:var(--paint-cream);
    font-family:'Work Sans', sans-serif;
  }
  body::before{
    content:"";
    position:fixed; inset:0; z-index:0;
    background:
      radial-gradient(rgba(243,234,214,0.025) 1px, transparent 1px),
      var(--wood-dark);
    background-size:3px 3px;
  }

  header.site-header{
    position:relative;
    z-index:2;
    display:flex;
    align-items:center;
    gap:0.9rem;
    padding:1.3rem 1.6rem;
  }
  .frame{
    position:relative;
    width:22px; height:26px;
    flex-shrink:0;
  }
  .frame::before{
    content:"";
    position:absolute; inset:0;
    border:1.4px solid var(--paint-cream);
    border-right:none;
    opacity:0.7;
  }
  header.site-header a.wordmark{
    font-family:'Space Grotesk', sans-serif;
    font-weight:300;
    font-size:0.68rem;
    letter-spacing:0.16em;
    text-transform:uppercase;
    color:var(--paint-cream);
    opacity:0.5;
    text-decoration:none;
  }

  main{
    position:relative;
    z-index:1;
    max-width:1100px;
    margin:0 auto;
    padding:2rem 6vw 6rem;
  }

  h1{
    font-family:'Space Grotesk', sans-serif;
    font-weight:400;
    font-size:clamp(2rem, 5.5vw, 3.2rem);
    text-align:center;
    margin:2rem 0 0.6rem;
    text-shadow:0 3px 10px rgba(0,0,0,0.5);
  }
  p.lead{
    text-align:center;
    color:rgba(243,234,214,0.6);
    font-size:0.95rem;
    max-width:44ch;
    margin:0 auto 3.5rem;
    line-height:1.6;
  }

  .board{
    columns:4 220px;
    column-gap:0.9rem;
  }
  @media (max-width: 720px){ .board{ columns:2 160px; } }

  .tile{
    break-inside:avoid;
    margin-bottom:0.9rem;
    border-radius:10px;
    overflow:hidden;
    border:1px solid rgba(243,234,214,0.1);
    position:relative;
    background:#2a2318;
  }
  .tile img{
    display:block;
    width:100%;
    height:auto;
  }
  .tile .swatch{
    aspect-ratio:1;
    display:flex;
    align-items:flex-end;
    padding:0.9rem;
    position:relative;
    background-blend-mode:overlay;
    background-image:
      repeating-linear-gradient(95deg, rgba(0,0,0,0.05) 0px, transparent 2px, transparent 6px, rgba(255,255,255,0.04) 8px, transparent 12px),
      radial-gradient(rgba(0,0,0,0.06) 1px, transparent 1px);
    background-size:auto, 3px 3px;
  }
  .tile .swatch.concrete{
    background-blend-mode:overlay, overlay, normal;
    background-image:
      radial-gradient(ellipse at 30% 20%, rgba(255,255,255,0.12), transparent 55%),
      radial-gradient(ellipse at 75% 80%, rgba(0,0,0,0.15), transparent 60%),
      repeating-linear-gradient(97deg, rgba(0,0,0,0.06) 0px, transparent 3px, transparent 9px, rgba(255,255,255,0.05) 11px, transparent 16px);
    background-size:auto, auto, auto;
  }
  .tile .label{
    position:relative;
    z-index:1;
    font-family:'Space Grotesk', sans-serif;
    font-size:0.85rem;
    letter-spacing:0.04em;
    color:var(--paint-cream);
    text-shadow:0 2px 6px rgba(0,0,0,0.6);
  }

  .tile.tall .swatch{ aspect-ratio:0.75; }
  .tile.wide .swatch{ aspect-ratio:1.5; }

  a.back{
    display:block;
    text-align:center;
    margin-top:3.5rem;
    font-size:0.85rem;
    color:var(--mustard);
    text-decoration:none;
    letter-spacing:0.04em;
  }
</style>
</head>
<body>

  <header class="site-header">
    <span class="frame"></span>
    <a class="wordmark" href="/">Raum schaffen</a>
  </header>

  <main>
    <h1>Was entsteht</h1>
    <p class="lead">Acht Disziplinen, ein Raum. Schaffensmenschen bringt zusammen, was zusammen gehört.</p>

    <a href="/poster.html" style="display:block; text-align:center; font-size:0.85rem; color:var(--mustard); text-decoration:underline; text-decoration-color:rgba(163,133,47,0.4); margin-bottom:2.5rem;">Raum für Schaffen — Poster ansehen &rarr;</a>

    <div class="board">
      <div class="tile tall">
        <div class="swatch concrete" style="background:linear-gradient(155deg, #b7b3ad, #8f8b85);">
          <span class="label">Architektur</span>
        </div>
      </div>
      <div class="tile">
        <img src="offfen-logo.jpeg" alt="">
      </div>
      <div class="tile wide">
        <div class="swatch" style="background:linear-gradient(155deg, #c8a24a, #9c7d38);">
          <span class="label">Grafik</span>
        </div>
      </div>
      <div class="tile">
        <div class="swatch concrete" style="background:linear-gradient(155deg, #b7b3ad, #6d6a65);">
          <span class="label">Musik</span>
        </div>
      </div>
      <div class="tile tall">
        <div class="swatch" style="background:linear-gradient(155deg, #b73228, #7c211a);">
          <span class="label">Performance</span>
        </div>
      </div>
      <div class="tile">
        <div class="swatch" style="background:linear-gradient(155deg, #121212, #3a3a3a);">
          <span class="label">Design</span>
        </div>
      </div>
      <div class="tile wide">
        <div class="swatch" style="background:linear-gradient(155deg, #c8a24a, #6d5729);">
          <span class="label">Kunst</span>
        </div>
      </div>
      <div class="tile">
        <div class="swatch concrete" style="background:linear-gradient(155deg, #b7b3ad, #494643);">
          <span class="label">Raum</span>
        </div>
      </div>
      <div class="tile tall">
        <div class="swatch concrete" style="background:linear-gradient(155deg, #b7b3ad, #6d6a65);">
          <span class="label">Und mehr</span>
        </div>
      </div>
    </div>

    <a class="back" href="/">&larr; Zurück zur Startseite</a>
  </main>

</body>
</html>
