  :root{
    --ink:#121212;
    --paper:#f3f1ec;
    --gold:#c8a24a;
    --beton:#b7b3ad;
    --ziegel:#b73228;
  }
  *{ box-sizing:border-box; margin:0; padding:0; }
  html,body{
    background:var(--paper);
    color:var(--ink);
    font-family:'Work Sans', sans-serif;
  }

  header.site-header{
    display:flex;
    align-items:center;
    gap:0.9rem;
    padding:1.3rem 1.6rem;
    border-bottom:1px solid rgba(18,18,18,0.1);
  }
  .frame{
    position:relative;
    width:20px; height:24px;
    flex-shrink:0;
  }
  .frame::before{
    content:"";
    position:absolute; inset:0;
    border:1.4px solid var(--ink);
    border-right:none;
  }
  header.site-header a.wordmark{
    font-family:'Space Grotesk', sans-serif;
    font-weight:400;
    font-size:0.85rem;
    letter-spacing:0.06em;
    color:var(--ink);
    text-decoration:none;
    opacity:0.8;
  }
  header.site-header nav{ margin-left:auto; display:flex; gap:1.6rem; }
  header.site-header nav a{
    font-size:0.85rem;
    color:rgba(18,18,18,0.5);
    text-decoration:none;
  }

  main{ max-width:1000px; margin:0 auto; padding:0 1.8rem; }

  .hero{ padding:5vh 0 6vh; }

  .eyebrow{
    font-size:0.78rem;
    letter-spacing:0.3em;
    text-transform:uppercase;
    color:var(--ziegel);
    font-weight:600;
    margin-bottom:1.6rem;
  }

  .manifest{
    font-family:'Space Grotesk', sans-serif;
    font-weight:600;
    font-size:clamp(2.4rem, 7vw, 5.2rem);
    line-height:1.04;
    letter-spacing:-0.01em;
  }
  .manifest .accent{ color:var(--gold); }
  .manifest .strike{
    position:relative;
    color:rgba(18,18,18,0.25);
  }
  .manifest .strike::after{
    content:"";
    position:absolute;
    left:-2%; right:-2%; top:50%;
    height:0.06em;
    background:var(--ziegel);
    transform:translateY(-50%) rotate(-2deg);
  }

  .lede{
    font-size:clamp(1.05rem, 2vw, 1.3rem);
    color:rgba(18,18,18,0.7);
    max-width:52ch;
    margin-top:2.2rem;
    line-height:1.55;
  }
  .lede strong{ color:var(--ink); font-weight:600; }

  .cta-row{
    display:flex;
    flex-wrap:wrap;
    gap:1rem;
    margin-top:2.6rem;
  }
  .cta{
    display:inline-flex;
    align-items:center;
    gap:0.5rem;
    padding:0.9rem 1.6rem;
    text-decoration:none;
    font-weight:600;
    font-size:0.92rem;
    border-radius:2px;
  }
  .cta.primary{
    background:var(--ink);
    color:var(--paper);
  }
  .cta.secondary{
    border:1.5px solid var(--ink);
    color:var(--ink);
  }
  .cta.primary:hover{ background:var(--ziegel); }
  .cta.secondary:hover{ background:var(--ink); color:var(--paper); }

  .disciplines-strip{
    display:flex;
    flex-wrap:wrap;
    gap:0.6rem;
    margin-top:3.4rem;
    padding-top:2.2rem;
    border-top:1px solid rgba(18,18,18,0.12);
  }
  .discipline-tag{
    font-size:0.8rem;
    padding:0.4rem 0.9rem;
    border:1px solid rgba(18,18,18,0.18);
    border-radius:2px;
    color:rgba(18,18,18,0.6);
  }
