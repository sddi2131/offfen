<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Raum für Schaffen — Schaffensmenschen</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500&family=Work+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --beton:#8f8b85;
    --beton-dark:#5a5754;
    --ink:#1a1917;
    --paper:#f3f1ec;
  }
  *{ box-sizing:border-box; margin:0; padding:0; }
  html,body{ height:100%; }

  body{
    min-height:100vh;
    display:flex;
    align-items:flex-end;
    justify-content:flex-start;
    padding:6vh 6vw;
    position:relative;
    overflow:hidden;
    background:linear-gradient(155deg, var(--beton), var(--beton-dark));
    font-family:'Work Sans', sans-serif;
  }

  /* concrete grain + mottling */
  body::before{
    content:"";
    position:fixed; inset:0; z-index:0;
    background-blend-mode:overlay, overlay, normal;
    background-image:
      radial-gradient(ellipse at 20% 15%, rgba(255,255,255,0.14), transparent 55%),
      radial-gradient(ellipse at 80% 85%, rgba(0,0,0,0.18), transparent 60%),
      repeating-linear-gradient(96deg, rgba(0,0,0,0.05) 0px, transparent 3px, transparent 8px, rgba(255,255,255,0.04) 10px, transparent 15px);
  }
  body::after{
    content:"";
    position:fixed; inset:0; z-index:0;
    background:radial-gradient(rgba(0,0,0,0.04) 1px, transparent 1px);
    background-size:3px 3px;
  }

  a.back{
    position:fixed;
    top:1.4rem; left:1.6rem;
    z-index:3;
    font-size:0.8rem;
    color:rgba(26,25,23,0.6);
    text-decoration:none;
    letter-spacing:0.04em;
  }

  .poster{
    position:relative;
    z-index:1;
    max-width:560px;
  }

  .frame{
    position:relative;
    width:24px; height:28px;
    margin-bottom:1.6rem;
  }
  .frame::before{
    content:"";
    position:absolute; inset:0;
    border:1.6px solid var(--ink);
    border-right:none;
    opacity:0.75;
  }

  h1{
    font-family:'Space Grotesk', sans-serif;
    font-weight:400;
    color:var(--ink);
    font-size:clamp(2.6rem, 8vw, 5rem);
    line-height:1.05;
    letter-spacing:-0.01em;
  }

  p.sub{
    margin-top:1.6rem;
    font-size:0.95rem;
    color:rgba(26,25,23,0.65);
    max-width:34ch;
    line-height:1.6;
  }

  .stamp{
    position:fixed;
    bottom:1.6rem; right:1.8rem;
    z-index:2;
    font-family:'Space Grotesk', sans-serif;
    font-weight:300;
    font-size:0.7rem;
    letter-spacing:0.16em;
    text-transform:uppercase;
    color:rgba(26,25,23,0.5);
  }
</style>
</head>
<body>

  <a class="back" href="/was-entsteht.html">&larr; Was entsteht</a>

  <div class="poster">
    <div class="frame"></div>
    <h1>Raum<br>für<br>Schaffen.</h1>
    <p class="sub">Ein Zuhause für Arts, Design, Entertainment, Architektur &amp; Grafik.</p>
  </div>

  <div class="stamp">Schaffensmenschen</div>

</body>
</html>
